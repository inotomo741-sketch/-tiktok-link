  reader.readAsDataURL(file);
});

document.getElementById("make").addEventListener("click", function() {
  preview.src = selectedImage;
});

document.getElementById("download").addEventListener("click", function() {
  const target = url.value.trim();
  if (!/^https?:\/\//i.test(target)) {
    alert("https:// から始まるURLを入力してください。");
    return;
  }

  const finalHTML = '<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link Card</title><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}body{display:flex;justify-content:center;align-items:center}img{width:100vw;height:100vh;object-fit:contain;cursor:pointer}</style></head><body><img src="' +
    selectedImage + '" onclick="window.location.href=' + JSON.stringify(target) + '" alt=""></body></html>';

  const blob = new Blob([finalHTML], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "tiktok_link_card.html";
  document.body.appendChild(a);
  a.click();
  a.remove();
});
</script>
</body>
</html>
